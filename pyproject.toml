[project]
name = "below-one"
version = "0.1.0"
description = "Goal adherence and directional outbreak containment for agent swarms"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML==6.0.2", "httpx==0.28.1", "fastapi==0.115.12", "uvicorn==0.34.2", "matplotlib==3.10.1", "networkx==3.4.2"]

[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "playwright==1.51.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["belowone"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
