name: reproduce

on:
  push:
    branches: [main, feat/below-one]
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      # No API keys in CI by design: offline regeneration only (KTD16/R37).
      KIMI_API_KEY: ""
      OPENROUTER_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: oven-sh/setup-bun@v2
      # omp 18.5.0 is a native Bun-compiled binary (not an npm package);
      # install source is adapter-owner knowledge — verify identity only.
      - name: verify installed omp identity
        run: |
          omp --version | grep -qx "omp/18.5.0" || {
            echo "omp 18.5.0 not installed/pinned; install step owned by adapters/omp maintainer"
            exit 1
          }
      - name: offline tests
        run: |
          make test
        # make test includes the omp adapter TS suite when adapters/omp exists
      - name: offline regeneration (metrics, figures, cards, docs)
        run: |
          make reproduce
          make check-docs
      - name: secret scan over committed artifacts
        run: |
          uv run python - <<'PY'
          import sys; sys.path.insert(0, '.')
          from pathlib import Path
          from belowone.experiments import scan_secrets
          import subprocess
          tracked = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True
          ).stdout.split()
          placeholder = re.compile(r"<[^>]+>|your[_-]|changeme", re.I)
          # direct scanner verdict, no exemptions
          hits = scan_secrets([Path(p) for p in tracked
                               if Path(p).is_file()])
          for hit in hits:
              print("SECRET:", hit)
          sys.exit(1 if hits else 0)
          PY
